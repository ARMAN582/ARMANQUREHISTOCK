body {

.sidebar h2 {
    margin-bottom: 20px;

    display: block;
    padding: 10px;
    margin: 8px 0;

}

.sidebar a:hover {
    background: #3b82f6;
}

.main {

.topbar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

/* Cards */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));

.card {

    padding: 15px;
    border-radius: 15px;

.copy {

.open {

}
