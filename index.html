```html id="1filepro"
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arman Dashboard</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f172a;
    color:white;
}
.topbar {
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:#1e293b;
}
button {
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.container {
    padding:20px;
}
.card {
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}
input {
    width:100%;
    padding:8px;
    margin:5px 0;
    border-radius:6px;
    border:none;
}
</style>

</head>
<body>

<div class="topbar">
    <h2>Dashboard</h2>
    <button onclick="toggleMode()">Switch Mode</button>
</div>

<div class="container">

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div class="card">
        <h3>Edit Profile</h3>
        <input id="name" placeholder="Name">
        <input id="bio" placeholder="Bio">
        <input id="income" placeholder="Monthly Income">
        <input id="trading" placeholder="Trading Income">
        <input id="phone" placeholder="Phone">
        <input id="email" placeholder="Email">
        <button onclick="save()">Save</button>
    </div>
</div>

<!-- PUBLIC VIEW -->
<div id="publicPanel" style="display:none;">
    <div class="card">
        <h1 id="p_name"></h1>
        <p id="p_bio"></p>
    </div>

    <div class="card">
        <h3>Income</h3>
        <p id="p_income"></p>
    </div>

    <div class="card">
        <h3>Contact</h3>
        <p id="p_phone"></p>
        <p id="p_email"></p>
    </div>
</div>

</div>

<script>

let mode = "admin";

function toggleMode(){
    mode = (mode === "admin") ? "public" : "admin";
    document.getElementById("adminPanel").style.display = mode==="admin"?"block":"none";
    document.getElementById("publicPanel").style.display = mode==="public"?"block":"none";
    load();
}

function save(){
    const data = {
        name: name.value,
        bio: bio.value,
        income: income.value,
        trading: trading.value,
        phone: phone.value,
        email: email.value
    };
    localStorage.setItem("armanData", JSON.stringify(data));
    alert("Saved ✅");
    load();
}

function load(){
    let data = JSON.parse(localStorage.getItem("armanData")) || {};

    // admin fill
    name.value = data.name || "";
    bio.value = data.bio || "";
    income.value = data.income || "";
    trading.value = data.trading || "";
    phone.value = data.phone || "";
    email.value = data.email || "";

    // public fill
    document.getElementById("p_name").innerText = data.name || "Your Name";
    document.getElementById("p_bio").innerText = data.bio || "Your bio";
    document.getElementById("p_income").innerText =
        "Monthly: " + (data.income||"0") + " | Trading: " + (data.trading||"0");
    document.getElementById("p_phone").innerText = "Phone: " + (data.phone||"-");
    document.getElementById("p_email").innerText = "Email: " + (data.email||"-");
}

load();

</script>

</body>
</html>
