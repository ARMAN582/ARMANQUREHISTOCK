<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arman Premium Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}
.container {
    padding:20px;
    max-width:1100px;
    margin:auto;
}
.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    transition:0.3s;
}
.card:hover {
    transform: translateY(-5px);
}
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}
h1 {
    font-size:28px;
}
.section-title {
    font-size:18px;
    margin-bottom:10px;
    opacity:0.8;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
    <h1 id="name"></h1>
    <p id="bio"></p>
</div>

<div class="grid">

<div class="card">
    <div class="section-title">💰 Income Overview</div>
    <canvas id="incomeChart"></canvas>
</div>

<div class="card">
    <div class="section-title">📊 Finance</div>
    <p id="finance"></p>
</div>

<div class="card">
    <div class="section-title">📱 Devices</div>
    <p id="devices"></p>
</div>

<div class="card">
    <div class="section-title">🏠 Assets</div>
    <p id="assets"></p>
</div>

<div class="card">
    <div class="section-title">☁️ Apps</div>
    <p id="apps"></p>
</div>

</div>

</div>

<script>

// 🔥 EDIT YOUR DATA HERE
const data = {
    name: "Arman Qureshi",
    bio: "Ads Agency | Trader",

    income: {
        monthly: 50000,
        trading: 20000,
        side: 10000
    },

    finance: "UPI + Trading Account",
    devices: "iPhone XR, iPhone 11, Laptop",
    assets: "House, Bike | Net Worth ₹5L+",
    apps: ["Drive","Gmail","Maps","Amazon","Spotify"]
};

// BASIC INFO
name.innerText = data.name;
bio.innerText = data.bio;

// OTHER DATA
finance.innerText = data.finance;
devices.innerText = data.devices;
assets.innerText = data.assets;
apps.innerText = data.apps.join(", ");

// 📊 CHART
new Chart(document.getElementById("incomeChart"), {
    type: "doughnut",
    data: {
        labels: ["Monthly","Trading","Side"],
        datasets: [{
            data: [
                data.income.monthly,
                data.income.trading,
                data.income.side
            ]
        }]
    }
});

</script>

</body>
</html>
