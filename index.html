<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arman Stocks</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;text-align:center;}
.container{padding:20px;}
.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px;}
button{padding:10px;margin:5px;border:none;border-radius:8px;background:#38bdf8;color:#000;font-weight:bold;}
input{padding:10px;border-radius:8px;border:none;margin:5px;}
.hidden{display:none;}
</style>
</head>

<body>

<div id="login" class="container">
<h2>Login</h2>
<input id="user" placeholder="Enter Email">
<button onclick="login()">Enter</button>
</div>

<div id="dash" class="hidden">

<h2>Your Portfolio</h2>

<div class="card">AQ Growth: <span id="g"></span></div>
<div class="card">AQ Premium: <span id="p"></span></div>
<div class="card">AQ Elite: <span id="e"></span></div>

<h3>Buy Stocks</h3>

<div class="card">
AQ Growth  
<br>
<button onclick="buy('growth',100)">Buy 100 (₹100)</button>
<button onclick="buy('growth',500)">Buy 500 (₹500)</button>
</div>

<div class="card">
AQ Premium  
<br>
<button onclick="buy('premium',200)">Buy 200 (₹200)</button>
<button onclick="buy('premium',1000)">Buy 1000 (₹800)</button>
</div>

<div class="card">
AQ Elite  
<br>
<button onclick="buy('elite',300)">Buy 300 (₹300)</button>
<button onclick="buy('elite',1500)">Buy 1500 (₹1000)</button>
</div>

<h3>Confirm Payment</h3>
<button onclick="confirm()">✔️ I Paid</button>

<h3>Purchase History</h3>
<div id="history"></div>

<button onclick="logout()">Logout</button>

</div>

<script>

let currentBuy=null;

// LOGIN
function login(){
 let user=document.getElementById("user").value;
 if(!user)return alert("Enter email");

 if(!localStorage.getItem(user)){
   localStorage.setItem(user,JSON.stringify({
     g:100,p:200,e:300
   }));
 }

 localStorage.setItem("u",user);

 document.getElementById("login").classList.add("hidden");
 document.getElementById("dash").classList.remove("hidden");

 load();
}

// LOAD DATA
function load(){
 let u=localStorage.getItem("u");
 let d=JSON.parse(localStorage.getItem(u));

 document.getElementById("g").innerText=d.g;
 document.getElementById("p").innerText=d.p;
 document.getElementById("e").innerText=d.e;

 loadHistory();
}

// BUY CLICK
function buy(type,qty){
 currentBuy={type,qty};

 window.open("https://wa.me/919026550240");

 alert("Send payment on WhatsApp\nThen click 'I Paid'");
}

// CONFIRM PURCHASE
function confirm(){
 if(!currentBuy)return alert("Select buy first");

 let u=localStorage.getItem("u");
 let d=JSON.parse(localStorage.getItem(u));

 if(currentBuy.type=="growth") d.g+=currentBuy.qty;
 if(currentBuy.type=="premium") d.p+=currentBuy.qty;
 if(currentBuy.type=="elite") d.e+=currentBuy.qty;

 localStorage.setItem(u,JSON.stringify(d));

 saveHistory("Bought "+currentBuy.qty+" "+currentBuy.type.toUpperCase());

 alert("Purchase Successful ✅");

 currentBuy=null;
 load();
}

// HISTORY
function saveHistory(text){
 let u=localStorage.getItem("u");
 let h=JSON.parse(localStorage.getItem(u+"_h"))||[];
 h.push(text+" | "+new Date().toLocaleString());
 localStorage.setItem(u+"_h",JSON.stringify(h));
}

function loadHistory(){
 let u=localStorage.getItem("u");
 let h=JSON.parse(localStorage.getItem(u+"_h"))||[];

 let box=document.getElementById("history");
 box.innerHTML="";

 h.forEach(i=>{
   box.innerHTML+="<div class='card'>"+i+"</div>";
 });
}

// LOGOUT
function logout(){
 localStorage.removeItem("u");
 location.reload();
}

// AUTO LOGIN
if(localStorage.getItem("u")){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("dash").classList.remove("hidden");
 load();
}

</script>

</body>
</html>
